<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>OMX · Proje Yönetim Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
             -webkit-font-smoothing: antialiased; background: #f6f7f9; color: #0f172a; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid #f6f7f9; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      input, select, textarea, button { font-family: inherit; }
    </style>
  </head>
  <body><div id="root"></div></body>
</html>
