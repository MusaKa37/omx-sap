<title>OMX Panel Önizlemesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{ color-scheme: light; }
  *{box-sizing:border-box;}
  body{margin:0; background:#f6f7f9; color:#0f172a;
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  input,select,textarea,button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;border:2px solid #f6f7f9;}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;}

  /* Önizleme şeridi */
  #onizleme{
    position:sticky; top:0; z-index:500;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:7px 18px; background:#0f172a; color:#cbd5e1;
    font-size:12px; letter-spacing:.01em;
  }
  #onizleme b{color:#fff; font-weight:600;}
  #onizleme .nokta{width:6px;height:6px;border-radius:50%;background:#41b3aa;flex:0 0 auto;}
  #onizleme .ayrac{color:#475569;}
  #onizleme .kapat{margin-left:auto;background:none;border:1px solid #334155;color:#94a3b8;
    border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;}
  #onizleme .kapat:hover{border-color:#475569;color:#cbd5e1;}
  @media (max-width:700px){ #onizleme .ayrac, #onizleme .uzun{display:none;} }
</style>
<div id="onizleme">
  <span class="nokta"></span>
  <b>Önizleme</b>
  <span class="ayrac">·</span>
  <span>Gerçek ekranlar, örnek OMX verisiyle. Kayıt ekleyip düzenleyebilirsiniz; yenileyince başa döner.</span>
  <span class="ayrac uzun">·</span>
  <span class="uzun">Sağ üstteki <b>Çıkış</b> giriş ekranını gösterir.</span>
  <button class="kapat" onclick="this.parentNode.remove()">Gizle</button>
</div>
<div id="root"></div>
